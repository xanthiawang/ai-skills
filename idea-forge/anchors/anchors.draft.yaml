# idea-forge calibration anchors — DRAFT for Albert's review (2026-07-02)
#
# Source: real publications from content/cv/peer-reviewed.bib (kejunying.com). No invented
# entries. `claim` is a BLINDED idea-card: the pre-publication idea stripped of title, venue,
# authors, and outcome, so the judge cannot recognize the paper during retrodiction.
# `known_tier` is PROPOSED from the real venue — CONFIRM or correct each one.
#
# Tier rubric used for the proposal:
#   top         = Nature/Science/Cell-family ceiling (Nature Aging/Medicine/Metabolism, Molecular Cell)
#   field       = strong selective field journal (Nature Communications, Circulation, EMBO J, Comms Med)
#   incremental = solid but low-leverage / early-career / abstract
#   failed      = ambitious idea that did NOT land (NONE here — the bib only has work that shipped)
#
# GAPS you must fill before calibration leaves advisory-only (needs >=12 anchors AND >=3 per tier):
#   - failed:      0 real entries. Add >=3 ambitious ideas of yours that went nowhere (and why).
#   - incremental: only 2. Add >=1 more.
#   - CS/agents:   0 anchors (all your pubs are bio). Decide: seed external CS landmarks with known
#                  outcomes (e.g. a transformer-class top paper vs an incremental benchmark), or accept
#                  that CS/agent ideas run advisory-only until you supply CS anchors.

